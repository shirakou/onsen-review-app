<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>レビュー編集</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-md-5">

                    <h1 class="h3 text-center mb-4">
                        レビュー編集
                    </h1>

                    <form th:action="@{/reviews/{reviewId}/edit(reviewId=${reviewId})}"
                          method="post"
                          th:object="${reviewForm}">

                        <!-- タイトル -->
                        <div class="mb-3">

                            <label class="form-label"
                                   for="title">
                                タイトル
                            </label>

                            <input class="form-control"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                   type="text"
                                   id="title"
                                   th:field="*{title}">

                            <div class="invalid-feedback"
                                 th:errors="*{title}">
                            </div>

                        </div>

                        <!-- 評価 -->
                        <div class="mb-3">

                            <label class="form-label"
                                   for="rating">
                                評価
                            </label>

                            <select class="form-select"
                                    th:classappend="${#fields.hasErrors('rating')} ? 'is-invalid'"
                                    id="rating"
                                    th:field="*{rating}">

                                <option value="">選択してください</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>

                            </select>

                            <div class="invalid-feedback"
                                 th:errors="*{rating}">
                            </div>

                        </div>

                        <!-- コメント -->
                        <div class="mb-4">

                            <label class="form-label"
                                   for="comment">
                                コメント
                            </label>

                            <textarea class="form-control"
                                      th:classappend="${#fields.hasErrors('comment')} ? 'is-invalid'"
                                      id="comment"
                                      rows="6"
                                      th:field="*{comment}">
                            </textarea>

                            <div class="invalid-feedback"
                                 th:errors="*{comment}">
                            </div>

                        </div>

                        <div class="d-grid gap-2">

                            <button class="btn btn-primary"
                                    type="submit">
                                更新する
                            </button>

                            <a class="btn btn-outline-secondary"
                               th:href="@{/mypage}">
                                マイページへ戻る
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>

</body>
</html>
