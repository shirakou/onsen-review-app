<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>温泉レビューアプリ</title>
</head>
<body>

    <h1>温泉レビューアプリ</h1>

    <h2>温泉一覧</h2>

    <div th:each="onsen : ${onsens}">
        <p th:text="${onsen.name}"></p>
        <p th:text="${onsen.prefecture}"></p>
    </div>

    <form th:action="@{/logout}" method="post">
        <button type="submit">ログアウト</button>
    </form>

</body>
</html>
