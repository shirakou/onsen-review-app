<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${onsen.name} + ' | 温泉レビュー'">
        温泉詳細
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">

    <!-- 温泉情報 -->
    <section class="card border-0 shadow-sm mb-4">

        <div class="row g-0">

            <div class="col-lg-5">

                <img class="img-fluid w-100 h-100 object-fit-cover rounded-start"
                     th:src="${onsen.imageUrl}"
                     th:alt="${onsen.name}"
                     style="max-height: 450px;">

            </div>

            <div class="col-lg-7">

                <div class="card-body p-4">

                    <h1 class="card-title mb-4"
                        th:text="${onsen.name}">
                        温泉名
                    </h1>

                    <div class="mb-4">

                        <h2 class="h5">平均評価</h2>

                        <p class="text-secondary"
                           th:if="${reviews.isEmpty()}">
                            まだ評価はありません。
                        </p>

                        <p class="fs-4 fw-bold text-warning"
                           th:if="${!reviews.isEmpty()}">

                            ★

                            <span th:text="${#numbers.formatDecimal(averageRating, 1, 1)}">
                            </span>

                            <span class="fs-6 text-secondary">
                                / 5.0
                            </span>

                        </p>

                    </div>

                    <dl class="row mb-0">

                        <dt class="col-sm-4">都道府県</dt>
                        <dd class="col-sm-8"
                            th:text="${onsen.prefecture}">
                        </dd>

                        <dt class="col-sm-4">住所</dt>
                        <dd class="col-sm-8"
                            th:text="${onsen.address}">
                        </dd>

                        <dt class="col-sm-4">電話番号</dt>
                        <dd class="col-sm-8"
                            th:text="${onsen.phone}">
                        </dd>

                        <dt class="col-sm-4">営業時間</dt>
                        <dd class="col-sm-8"
                            th:text="${onsen.businessHours}">
                        </dd>

                        <dt class="col-sm-4">定休日</dt>
                        <dd class="col-sm-8"
                            th:text="${onsen.holiday}">
                        </dd>

                        <dt class="col-sm-4">大人料金</dt>
                        <dd class="col-sm-8">
                            <span th:text="${onsen.adultPrice}"></span>円
                        </dd>

                        <dt class="col-sm-4">子ども料金</dt>
                        <dd class="col-sm-8">
                            <span th:text="${onsen.childPrice}"></span>円
                        </dd>

                        <dt class="col-sm-4">最寄駅</dt>
                        <dd class="col-sm-8"
                            th:text="${onsen.nearestStation}">
                        </dd>

                        <dt class="col-sm-4">駅からの時間</dt>
                        <dd class="col-sm-8">
                            <span th:text="${onsen.stationTime}"></span>分
                        </dd>

                    </dl>

                </div>

            </div>

        </div>

    </section>

    <!-- 設備 -->
    <section class="card border-0 shadow-sm mb-4">

        <div class="card-body p-4">

            <h2 class="h4 mb-3">設備</h2>

            <div class="d-flex flex-wrap gap-2">

                <span class="badge"
                      th:classappend="${onsen.familyBath} ? 'text-bg-primary' : 'text-bg-secondary'"
                      th:text="${onsen.familyBath ? '家族風呂あり' : '家族風呂なし'}">
                </span>

                <span class="badge"
                      th:classappend="${onsen.sauna} ? 'text-bg-primary' : 'text-bg-secondary'"
                      th:text="${onsen.sauna ? 'サウナあり' : 'サウナなし'}">
                </span>

                <span class="badge"
                      th:classappend="${onsen.openAirBath} ? 'text-bg-primary' : 'text-bg-secondary'"
                      th:text="${onsen.openAirBath ? '露天風呂あり' : '露天風呂なし'}">
                </span>

                <span class="badge"
                      th:classappend="${onsen.restaurant} ? 'text-bg-primary' : 'text-bg-secondary'"
                      th:text="${onsen.restaurant ? '食事処あり' : '食事処なし'}">
                </span>

                <span class="badge"
                      th:classappend="${onsen.alcohol} ? 'text-bg-primary' : 'text-bg-secondary'"
                      th:text="${onsen.alcohol ? 'アルコールあり' : 'アルコールなし'}">
                </span>

                <span class="badge"
                      th:classappend="${onsen.towelRental} ? 'text-bg-primary' : 'text-bg-secondary'"
                      th:text="${onsen.towelRental ? 'タオルレンタルあり' : 'タオルレンタルなし'}">
                </span>

                <span class="badge"
                      th:classappend="${onsen.parking} ? 'text-bg-primary' : 'text-bg-secondary'"
                      th:text="${onsen.parking ? '駐車場あり' : '駐車場なし'}">
                </span>

            </div>

        </div>

    </section>

    <!-- 温泉の説明 -->
    <section class="card border-0 shadow-sm mb-4">

        <div class="card-body p-4">

            <h2 class="h4 mb-3">温泉について</h2>

            <p class="mb-0"
               style="white-space: pre-wrap;"
               th:text="${onsen.description}">
            </p>

        </div>

    </section>

    <!-- お気に入り -->
    <section class="mb-4"
             sec:authorize="isAuthenticated()">

        <form th:if="${!isFavorite}"
              th:action="@{/onsens/{onsenId}/favorite(onsenId=${onsen.id})}"
              method="post">

            <button class="btn btn-outline-primary"
                    type="submit">
                お気に入りに登録
            </button>

        </form>

        <form th:if="${isFavorite}"
              th:action="@{/onsens/{onsenId}/favorite/delete(onsenId=${onsen.id})}"
              method="post">

            <button class="btn btn-primary"
                    type="submit">
                お気に入りを解除
            </button>

        </form>

    </section>

    <!-- レビュー投稿 -->
    <section class="card border-0 shadow-sm mb-4"
             sec:authorize="isAuthenticated()">

        <div class="card-body p-4">

            <h2 class="h4 mb-4">レビューを投稿</h2>

            <div class="alert alert-danger"
                 th:if="${reviewError}"
                 th:text="${reviewError}">
            </div>

            <form th:action="@{/onsens/{onsenId}/reviews(onsenId=${onsen.id})}"
                  method="post"
                  th:object="${reviewForm}">

                <div class="mb-3">

                    <label class="form-label"
                           for="title">
                        タイトル
                    </label>

                    <input class="form-control"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                           type="text"
                           id="title"
                           th:field="*{title}">

                    <div class="invalid-feedback"
                         th:errors="*{title}">
                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label"
                           for="rating">
                        評価
                    </label>

                    <select class="form-select"
                            th:classappend="${#fields.hasErrors('rating')} ? 'is-invalid'"
                            id="rating"
                            th:field="*{rating}">

                        <option value="">
                            選択してください
                        </option>

                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>

                    </select>

                    <div class="invalid-feedback"
                         th:errors="*{rating}">
                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label"
                           for="comment">
                        コメント
                    </label>

                    <textarea class="form-control"
                              th:classappend="${#fields.hasErrors('comment')} ? 'is-invalid'"
                              id="comment"
                              rows="5"
                              th:field="*{comment}">
                    </textarea>

                    <div class="invalid-feedback"
                         th:errors="*{comment}">
                    </div>

                </div>

                <button class="btn btn-primary"
                        type="submit">
                    投稿する
                </button>

            </form>

        </div>

    </section>

    <!-- 未ログイン時 -->
    <div class="alert alert-info"
         sec:authorize="isAnonymous()">

        レビューの投稿やお気に入り登録には

        <a class="alert-link"
           th:href="@{/login}">
            ログイン
        </a>

        が必要です。

    </div>

    <!-- レビュー一覧 -->
    <section>

        <h2 class="h3 mb-4">レビュー一覧</h2>

        <div class="alert alert-secondary"
             th:if="${reviews.isEmpty()}">
            まだレビューはありません。
        </div>

        <div class="card border-0 shadow-sm mb-3"
             th:each="review : ${reviews}">

            <div class="card-body p-4">

                <div class="d-flex justify-content-between align-items-start mb-3">

                    <div>

                        <h3 class="h5 mb-1"
                            th:text="${review.title}">
                            レビュータイトル
                        </h3>

                        <p class="text-secondary mb-0">

                            投稿者：

                            <span th:text="${review.user.username}">
                            </span>

                        </p>

                    </div>

                    <span class="badge text-bg-warning fs-6">

                        ★

                        <span th:text="${review.rating}">
                        </span>

                    </span>

                </div>

                <p class="mb-3"
                   style="white-space: pre-wrap;"
                   th:text="${review.comment}">
                </p>

                <div sec:authorize="isAuthenticated()">

                    <div class="d-flex gap-2"
                         th:if="${#authentication.name == review.user.email}">

                        <a class="btn btn-outline-primary btn-sm"
                           th:href="@{/reviews/{reviewId}/edit(reviewId=${review.id})}">
                            編集
                        </a>

                        <form th:action="@{/reviews/{reviewId}/delete(reviewId=${review.id})}"
                              method="post"
                              onsubmit="return confirm('このレビューを削除しますか？');">

                            <button class="btn btn-outline-danger btn-sm"
                                    type="submit">
                                削除
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <div class="mt-4">

        <a class="btn btn-outline-secondary"
           th:href="@{/}">
            温泉一覧へ戻る
        </a>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>

</body>
</html>
