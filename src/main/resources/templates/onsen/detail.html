<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>温泉詳細</title>
</head>

<body>

    <!-- 温泉名 -->
    <h1 th:text="${onsen.name}">温泉名</h1>

    <!-- 温泉画像 -->
    <div>
        <img th:src="${onsen.imageUrl}"
             th:alt="${onsen.name}"
             width="300">
    </div>

    <!-- 温泉基本情報 -->
    <div>
        <p>
            都道府県：
            <span th:text="${onsen.prefecture}"></span>
        </p>

        <p>
            住所：
            <span th:text="${onsen.address}"></span>
        </p>

        <p>
            電話番号：
            <span th:text="${onsen.phone}"></span>
        </p>

        <p>
            営業時間：
            <span th:text="${onsen.businessHours}"></span>
        </p>

        <p>
            定休日：
            <span th:text="${onsen.holiday}"></span>
        </p>

        <p>
            大人料金：
            <span th:text="${onsen.adultPrice}"></span>円
        </p>

        <p>
            子ども料金：
            <span th:text="${onsen.childPrice}"></span>円
        </p>

        <p>
            最寄駅：
            <span th:text="${onsen.nearestStation}"></span>
        </p>

        <p>
            駅からの所要時間：
            <span th:text="${onsen.stationTime}"></span>分
        </p>

        <p>
            家族風呂：
            <span th:text="${onsen.familyBath ? 'あり' : 'なし'}"></span>
        </p>

        <p>
            サウナ：
            <span th:text="${onsen.sauna ? 'あり' : 'なし'}"></span>
        </p>

        <p>
            露天風呂：
            <span th:text="${onsen.openAirBath ? 'あり' : 'なし'}"></span>
        </p>

        <p>
            食事処：
            <span th:text="${onsen.restaurant ? 'あり' : 'なし'}"></span>
        </p>

        <p>
            アルコール：
            <span th:text="${onsen.alcohol ? 'あり' : 'なし'}"></span>
        </p>

        <p>
            タオルレンタル：
            <span th:text="${onsen.towelRental ? 'あり' : 'なし'}"></span>
        </p>

        <p>
            駐車場：
            <span th:text="${onsen.parking ? 'あり' : 'なし'}"></span>
        </p>

        <p>
            説明：
            <span th:text="${onsen.description}"></span>
        </p>
    </div>


    <!-- レビュー投稿 -->
    <h2>レビュー投稿</h2>

	<p th:if="${reviewError}"
	   th:text="${reviewError}"></p>

    <form th:action="@{/onsens/{onsenId}/reviews(onsenId=${onsen.id})}"
          method="post"
          th:object="${reviewForm}">

        <!-- タイトル -->
        <div>
            <label for="title">タイトル</label>

            <input type="text"
                   id="title"
                   th:field="*{title}">

            <p th:if="${#fields.hasErrors('title')}"
               th:errors="*{title}"></p>
        </div>


        <!-- 評価 -->
        <div>
            <label for="rating">評価</label>

            <select id="rating"
                    th:field="*{rating}">

                <option value="">選択してください</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>

            </select>

            <p th:if="${#fields.hasErrors('rating')}"
               th:errors="*{rating}"></p>
        </div>


        <!-- コメント -->
        <div>
            <label for="comment">コメント</label>

            <textarea id="comment"
                      th:field="*{comment}"></textarea>

            <p th:if="${#fields.hasErrors('comment')}"
               th:errors="*{comment}"></p>
        </div>


        <!-- 投稿 -->
        <button type="submit">投稿</button>

    </form>
    
    <h2>レビュー一覧</h2>

<div th:if="${reviews.isEmpty()}">
    <p>まだレビューはありません。</p>
</div>

<div th:each="review : ${reviews}">

    <p>
        投稿者：
        <span th:text="${review.user.username}"></span>
    </p>

    <p>
        タイトル：
        <span th:text="${review.title}"></span>
    </p>

    <p>
        評価：
        <span th:text="${review.rating}"></span>
    </p>

    <p>
        コメント：
        <span th:text="${review.comment}"></span>
    </p>
    
	<a th:href="@{/reviews/{reviewId}/edit(reviewId=${review.id})}">
	    編集
	</a>

    <hr>

</div>


    <!-- 一覧画面へ戻る -->
    <a th:href="@{/}">一覧へ戻る</a>

</body>

</html>
