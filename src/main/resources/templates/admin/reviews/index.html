<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>レビュー管理</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">

    <div class="mb-4">

        <h1 class="h2 fw-bold mb-1">
            レビュー管理
        </h1>

        <p class="text-secondary mb-0">
            投稿されたレビューの確認・削除ができます。
        </p>

    </div>

    <!-- 削除エラー -->
    <div class="alert alert-danger"
         th:if="${param.deleteError != null}">

        レビューを削除できませんでした。

    </div>

    <!-- レビューが0件の場合 -->
    <div class="alert alert-secondary"
         th:if="${reviews.isEmpty()}">

        投稿されているレビューはありません。

    </div>

    <!-- レビュー一覧 -->
    <div class="card border-0 shadow-sm"
         th:if="${!reviews.isEmpty()}">

        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0">

                <thead class="table-light">

                    <tr>

                        <th scope="col">ID</th>
                        <th scope="col">温泉名</th>
                        <th scope="col">投稿者</th>
                        <th scope="col">メールアドレス</th>
                        <th scope="col">タイトル</th>
                        <th scope="col">評価</th>
                        <th scope="col">コメント</th>
                        <th scope="col">投稿日時</th>
                        <th scope="col">操作</th>

                    </tr>

                </thead>

                <tbody>

                    <tr th:each="review : ${reviews}">

                        <td th:text="${review.id}">
                        </td>

                        <td class="fw-semibold"
                            th:text="${review.onsen.name}">
                        </td>

                        <td th:text="${review.user.username}">
                        </td>

                        <td th:text="${review.user.email}">
                        </td>

                        <td th:text="${review.title}">
                        </td>

                        <td>

                            <span class="badge text-bg-warning">

                                ★

                                <span th:text="${review.rating}">
                                </span>

                            </span>

                        </td>

                        <td style="min-width: 240px; max-width: 360px; white-space: normal;"
                            th:text="${review.comment}">
                        </td>

                        <td th:text="${#temporals.format(review.createdAt, 'yyyy/MM/dd HH:mm')}">
                        </td>

                        <td>

                            <form th:action="@{/admin/reviews/{reviewId}/delete(reviewId=${review.id})}"
                                  method="post"
                                  onsubmit="return confirm('このレビューを削除しますか？');">

                                <button class="btn btn-outline-danger btn-sm"
                                        type="submit">
                                    削除
                                </button>

                            </form>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <div class="mt-4">

        <a class="btn btn-outline-secondary"
           th:href="@{/admin}">
            管理者メニューへ戻る
        </a>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>

</body>
</html>
