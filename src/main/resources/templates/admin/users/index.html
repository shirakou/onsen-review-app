<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>ユーザー管理</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">

    <div class="mb-4">

        <h1 class="h2 fw-bold mb-1">
            ユーザー管理
        </h1>

        <p class="text-secondary mb-0">
            登録ユーザーの確認・利用停止・再有効化ができます。
        </p>

    </div>

    <!-- 状態変更エラー -->
    <div class="alert alert-danger"
         th:if="${param.statusError != null}">

        ユーザーの状態を変更できませんでした。

    </div>

    <!-- ユーザーが0件の場合 -->
    <div class="alert alert-secondary"
         th:if="${users.isEmpty()}">

        登録されているユーザーはいません。

    </div>

    <!-- ユーザー一覧 -->
    <div class="card border-0 shadow-sm"
         th:if="${!users.isEmpty()}">

        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0">

                <thead class="table-light">

                    <tr>

                        <th scope="col">ID</th>
                        <th scope="col">ユーザー名</th>
                        <th scope="col">メールアドレス</th>
                        <th scope="col">権限</th>
                        <th scope="col">利用状況</th>
                        <th scope="col">登録日時</th>
                        <th scope="col">操作</th>

                    </tr>

                </thead>

                <tbody>

                    <tr th:each="user : ${users}">

                        <td th:text="${user.id}">
                        </td>

                        <td class="fw-semibold"
                            th:text="${user.username}">
                        </td>

                        <td th:text="${user.email}">
                        </td>

                        <td>

                            <span class="badge"
                                  th:classappend="${user.role == 'ROLE_ADMIN'}
                                          ? 'text-bg-warning'
                                          : 'text-bg-secondary'"
                                  th:text="${user.role == 'ROLE_ADMIN'}
                                          ? '管理者'
                                          : '一般ユーザー'">
                            </span>

                        </td>

                        <td>

                            <span class="badge"
                                  th:classappend="${user.isActive}
                                          ? 'text-bg-success'
                                          : 'text-bg-danger'"
                                  th:text="${user.isActive}
                                          ? '利用中'
                                          : '利用停止'">
                            </span>

                        </td>

                        <td th:text="${#temporals.format(user.createdAt, 'yyyy/MM/dd HH:mm')}">
                        </td>

                        <td>

                            <!-- 利用中の一般ユーザー -->
                            <form th:if="${user.isActive and user.role != 'ROLE_ADMIN'}"
                                  th:action="@{/admin/users/{userId}/deactivate(userId=${user.id})}"
                                  method="post"
                                  onsubmit="return confirm('このユーザーを利用停止にしますか？');">

                                <button class="btn btn-outline-danger btn-sm"
                                        type="submit">
                                    利用停止
                                </button>

                            </form>

                            <!-- 利用停止中の一般ユーザー -->
                            <form th:if="${!user.isActive and user.role != 'ROLE_ADMIN'}"
                                  th:action="@{/admin/users/{userId}/activate(userId=${user.id})}"
                                  method="post"
                                  onsubmit="return confirm('このユーザーを再有効化しますか？');">

                                <button class="btn btn-outline-success btn-sm"
                                        type="submit">
                                    再有効化
                                </button>

                            </form>

                            <!-- 管理者 -->
                            <span class="text-secondary small"
                                  th:if="${user.role == 'ROLE_ADMIN'}">
                                変更不可
                            </span>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <div class="mt-4">

        <a class="btn btn-outline-secondary"
           th:href="@{/admin}">
            管理者メニューへ戻る
        </a>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>

</body>
</html>
