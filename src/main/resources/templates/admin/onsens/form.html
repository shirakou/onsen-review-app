<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title th:text="${onsenId == null} ? '温泉登録' : '温泉編集'">
        温泉登録
    </title>
</head>

<body>

    <h1 th:text="${onsenId == null} ? '温泉登録' : '温泉編集'">
        温泉登録
    </h1>

    <form th:action="${onsenId == null}
            ? @{/admin/onsens/new}
            : @{/admin/onsens/{id}/edit(id=${onsenId})}"
          method="post"
          th:object="${onsenForm}">

        <div>
            <label for="name">温泉名</label>

            <input type="text"
                   id="name"
                   th:field="*{name}">

            <p th:errors="*{name}"></p>
        </div>

        <div>
            <label for="imageUrl">画像URL</label>

            <input type="url"
                   id="imageUrl"
                   th:field="*{imageUrl}">

            <p th:errors="*{imageUrl}"></p>
        </div>

        <div>
            <label for="prefecture">都道府県</label>

            <input type="text"
                   id="prefecture"
                   th:field="*{prefecture}">

            <p th:errors="*{prefecture}"></p>
        </div>

        <div>
            <label for="address">住所</label>

            <input type="text"
                   id="address"
                   th:field="*{address}">

            <p th:errors="*{address}"></p>
        </div>

        <div>
            <label for="phone">電話番号</label>

            <input type="tel"
                   id="phone"
                   th:field="*{phone}">

            <p th:errors="*{phone}"></p>
        </div>

        <div>
            <label for="businessHours">営業時間</label>

            <input type="text"
                   id="businessHours"
                   th:field="*{businessHours}">

            <p th:errors="*{businessHours}"></p>
        </div>

        <div>
            <label for="holiday">定休日</label>

            <input type="text"
                   id="holiday"
                   th:field="*{holiday}">

            <p th:errors="*{holiday}"></p>
        </div>

        <div>
            <label for="adultPrice">大人料金</label>

            <input type="number"
                   id="adultPrice"
                   min="0"
                   th:field="*{adultPrice}">

            <p th:errors="*{adultPrice}"></p>
        </div>

        <div>
            <label for="childPrice">子供料金</label>

            <input type="number"
                   id="childPrice"
                   min="0"
                   th:field="*{childPrice}">

            <p th:errors="*{childPrice}"></p>
        </div>

        <div>
            <label for="nearestStation">最寄り駅</label>

            <input type="text"
                   id="nearestStation"
                   th:field="*{nearestStation}">

            <p th:errors="*{nearestStation}"></p>
        </div>

        <div>
            <label for="stationTime">駅からの時間（分）</label>

            <input type="number"
                   id="stationTime"
                   min="0"
                   th:field="*{stationTime}">

            <p th:errors="*{stationTime}"></p>
        </div>

        <fieldset>
            <legend>設備</legend>

            <div>
                <input type="checkbox"
                       id="familyBath"
                       th:field="*{familyBath}">

                <label for="familyBath">家族風呂</label>
            </div>

            <div>
                <input type="checkbox"
                       id="sauna"
                       th:field="*{sauna}">

                <label for="sauna">サウナ</label>
            </div>

            <div>
                <input type="checkbox"
                       id="openAirBath"
                       th:field="*{openAirBath}">

                <label for="openAirBath">露天風呂</label>
            </div>

            <div>
                <input type="checkbox"
                       id="restaurant"
                       th:field="*{restaurant}">

                <label for="restaurant">食事処</label>
            </div>

            <div>
                <input type="checkbox"
                       id="alcohol"
                       th:field="*{alcohol}">

                <label for="alcohol">アルコール</label>
            </div>

            <div>
                <input type="checkbox"
                       id="towelRental"
                       th:field="*{towelRental}">

                <label for="towelRental">タオル貸出</label>
            </div>

            <div>
                <input type="checkbox"
                       id="parking"
                       th:field="*{parking}">

                <label for="parking">駐車場</label>
            </div>
        </fieldset>

        <div>
            <label for="description">説明</label>

            <textarea id="description"
                      rows="6"
                      th:field="*{description}">
            </textarea>

            <p th:errors="*{description}"></p>
        </div>

        <div>
            <button type="submit"
                    th:text="${onsenId == null} ? '登録する' : '更新する'">
                登録する
            </button>
        </div>

    </form>

    <a th:href="@{/admin/onsens}">
        温泉管理一覧へ戻る
    </a>

</body>

</html>
