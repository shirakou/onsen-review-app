<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${onsenId == null} ? '温泉登録' : '温泉編集'">
        温泉登録
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-xl-10">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-md-5">

                    <h1 class="h2 mb-4"
                        th:text="${onsenId == null} ? '温泉登録' : '温泉編集'">
                        温泉登録
                    </h1>

                    <form th:action="${onsenId == null}
                            ? @{/admin/onsens/new}
                            : @{/admin/onsens/{id}/edit(id=${onsenId})}"
                          method="post"
                          th:object="${onsenForm}">

                        <!-- 基本情報 -->
                        <h2 class="h5 border-bottom pb-2 mb-4">
                            基本情報
                        </h2>

                        <div class="row g-3 mb-4">

                            <div class="col-md-6">

                                <label class="form-label"
                                       for="name">
                                    温泉名
                                </label>

                                <input class="form-control"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                       type="text"
                                       id="name"
                                       th:field="*{name}">

                                <div class="invalid-feedback"
                                     th:errors="*{name}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label"
                                       for="imageUrl">
                                    画像URL
                                </label>

                                <input class="form-control"
                                       th:classappend="${#fields.hasErrors('imageUrl')} ? 'is-invalid'"
                                       type="url"
                                       id="imageUrl"
                                       th:field="*{imageUrl}">

                                <div class="invalid-feedback"
                                     th:errors="*{imageUrl}">
                                </div>

                            </div>

                            <div class="col-md-4">

                                <label class="form-label"
                                       for="prefecture">
                                    都道府県
                                </label>

                                <input class="form-control"
                                       th:classappend="${#fields.hasErrors('prefecture')} ? 'is-invalid'"
                                       type="text"
                                       id="prefecture"
                                       th:field="*{prefecture}">

                                <div class="invalid-feedback"
                                     th:errors="*{prefecture}">
                                </div>

                            </div>

                            <div class="col-md-8">

                                <label class="form-label"
                                       for="address">
                                    住所
                                </label>

                                <input class="form-control"
                                       th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"
                                       type="text"
                                       id="address"
                                       th:field="*{address}">

                                <div class="invalid-feedback"
                                     th:errors="*{address}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label"
                                       for="phone">
                                    電話番号
                                </label>

                                <input class="form-control"
                                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                                       type="tel"
                                       id="phone"
                                       th:field="*{phone}">

                                <div class="invalid-feedback"
                                     th:errors="*{phone}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label"
                                       for="businessHours">
                                    営業時間
                                </label>

                                <input class="form-control"
                                       th:classappend="${#fields.hasErrors('businessHours')} ? 'is-invalid'"
                                       type="text"
                                       id="businessHours"
                                       th:field="*{businessHours}">

                                <div class="invalid-feedback"
                                     th:errors="*{businessHours}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label"
                                       for="holiday">
                                    定休日
                                </label>

                                <input class="form-control"
                                       th:classappend="${#fields.hasErrors('holiday')} ? 'is-invalid'"
                                       type="text"
                                       id="holiday"
                                       th:field="*{holiday}">

                                <div class="invalid-feedback"
                                     th:errors="*{holiday}">
                                </div>

                            </div>

                        </div>

                        <!-- 料金 -->
                        <h2 class="h5 border-bottom pb-2 mb-4">
                            料金
                        </h2>

                        <div class="row g-3 mb-4">

                            <div class="col-md-6">

                                <label class="form-label"
                                       for="adultPrice">
                                    大人料金
                                </label>

                                <div class="input-group">

                                    <input class="form-control"
                                           th:classappend="${#fields.hasErrors('adultPrice')} ? 'is-invalid'"
                                           type="number"
                                           id="adultPrice"
                                           min="0"
                                           th:field="*{adultPrice}">

                                    <span class="input-group-text">
                                        円
                                    </span>

                                    <div class="invalid-feedback"
                                         th:errors="*{adultPrice}">
                                    </div>

                                </div>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label"
                                       for="childPrice">
                                    子ども料金
                                </label>

                                <div class="input-group">

                                    <input class="form-control"
                                           th:classappend="${#fields.hasErrors('childPrice')} ? 'is-invalid'"
                                           type="number"
                                           id="childPrice"
                                           min="0"
                                           th:field="*{childPrice}">

                                    <span class="input-group-text">
                                        円
                                    </span>

                                    <div class="invalid-feedback"
                                         th:errors="*{childPrice}">
                                    </div>

                                </div>

                            </div>

                        </div>

                        <!-- アクセス -->
                        <h2 class="h5 border-bottom pb-2 mb-4">
                            アクセス
                        </h2>

                        <div class="row g-3 mb-4">

                            <div class="col-md-6">

                                <label class="form-label"
                                       for="nearestStation">
                                    最寄り駅
                                </label>

                                <input class="form-control"
                                       th:classappend="${#fields.hasErrors('nearestStation')} ? 'is-invalid'"
                                       type="text"
                                       id="nearestStation"
                                       th:field="*{nearestStation}">

                                <div class="invalid-feedback"
                                     th:errors="*{nearestStation}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label"
                                       for="stationTime">
                                    駅からの時間
                                </label>

                                <div class="input-group">

                                    <input class="form-control"
                                           th:classappend="${#fields.hasErrors('stationTime')} ? 'is-invalid'"
                                           type="number"
                                           id="stationTime"
                                           min="0"
                                           th:field="*{stationTime}">

                                    <span class="input-group-text">
                                        分
                                    </span>

                                    <div class="invalid-feedback"
                                         th:errors="*{stationTime}">
                                    </div>

                                </div>

                            </div>

                        </div>

                        <!-- 設備 -->
                        <fieldset class="mb-4">

                            <legend class="h5 border-bottom pb-2 mb-4">
                                設備
                            </legend>

                            <div class="row g-3">

                                <div class="col-sm-6 col-md-4">

                                    <div class="form-check">

                                        <input class="form-check-input"
                                               type="checkbox"
                                               id="familyBath"
                                               th:field="*{familyBath}">

                                        <label class="form-check-label"
                                               for="familyBath">
                                            家族風呂
                                        </label>

                                    </div>

                                </div>

                                <div class="col-sm-6 col-md-4">

                                    <div class="form-check">

                                        <input class="form-check-input"
                                               type="checkbox"
                                               id="sauna"
                                               th:field="*{sauna}">

                                        <label class="form-check-label"
                                               for="sauna">
                                            サウナ
                                        </label>

                                    </div>

                                </div>

                                <div class="col-sm-6 col-md-4">

                                    <div class="form-check">

                                        <input class="form-check-input"
                                               type="checkbox"
                                               id="openAirBath"
                                               th:field="*{openAirBath}">

                                        <label class="form-check-label"
                                               for="openAirBath">
                                            露天風呂
                                        </label>

                                    </div>

                                </div>

                                <div class="col-sm-6 col-md-4">

                                    <div class="form-check">

                                        <input class="form-check-input"
                                               type="checkbox"
                                               id="restaurant"
                                               th:field="*{restaurant}">

                                        <label class="form-check-label"
                                               for="restaurant">
                                            食事処
                                        </label>

                                    </div>

                                </div>

                                <div class="col-sm-6 col-md-4">

                                    <div class="form-check">

                                        <input class="form-check-input"
                                               type="checkbox"
                                               id="alcohol"
                                               th:field="*{alcohol}">

                                        <label class="form-check-label"
                                               for="alcohol">
                                            アルコール
                                        </label>

                                    </div>

                                </div>

                                <div class="col-sm-6 col-md-4">

                                    <div class="form-check">

                                        <input class="form-check-input"
                                               type="checkbox"
                                               id="towelRental"
                                               th:field="*{towelRental}">

                                        <label class="form-check-label"
                                               for="towelRental">
                                            タオル貸出
                                        </label>

                                    </div>

                                </div>

                                <div class="col-sm-6 col-md-4">

                                    <div class="form-check">

                                        <input class="form-check-input"
                                               type="checkbox"
                                               id="parking"
                                               th:field="*{parking}">

                                        <label class="form-check-label"
                                               for="parking">
                                            駐車場
                                        </label>

                                    </div>

                                </div>

                            </div>

                        </fieldset>

                        <!-- 説明 -->
                        <div class="mb-4">

                            <label class="form-label"
                                   for="description">
                                説明
                            </label>

                            <textarea class="form-control"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                      id="description"
                                      rows="6"
                                      th:field="*{description}">
                            </textarea>

                            <div class="invalid-feedback"
                                 th:errors="*{description}">
                            </div>

                        </div>

                        <div class="d-flex flex-wrap gap-2">

                            <button class="btn btn-primary"
                                    type="submit"
                                    th:text="${onsenId == null} ? '登録する' : '更新する'">
                                登録する
                            </button>

                            <a class="btn btn-outline-secondary"
                               th:href="@{/admin/onsens}">
                                温泉管理一覧へ戻る
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>

</body>
</html>
